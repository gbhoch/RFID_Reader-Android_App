plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

// URL da API em desenvolvimento.
//
// 10.0.2.2 é o host visto de DENTRO do emulador — num coletor físico ele não
// existe, e o app tem de apontar para o IP do backend na LAN. Cada máquina
// define o seu em local.properties (não versionado), sem editar este arquivo:
//
//   api.base.url=http://192.168.0.42:3000/
//
// A porta é a 3000 (NestJS). A 8080 é o nginx do frontend Angular.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def devApiBaseUrl = localProps.getProperty('api.base.url', 'http://10.0.2.2:3000/')

android {
    namespace 'com.megagoglio.rfidinventory'
    compileSdk 36

    defaultConfig {
        applicationId "com.megagoglio.rfidinventory"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        // URL base da API. Sobrescreva por build type ou em local.properties.
        buildConfigField "String", "API_BASE_URL", "\"https://api.megagoglio.com/\""
    }

    buildTypes {
        debug {
            buildConfigField "String", "API_BASE_URL", "\"${devApiBaseUrl}\""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    // --- SDK da TSL ---
    implementation project(':Rfid.AsciiProtocol-Library')
    implementation project(':DeviceList')
    // Exigido pelo AsciiCommander para difundir STATE_CHANGED_NOTIFICATION
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'

    // --- AndroidX base ---
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'

    // --- Compose ---
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // --- Persistencia ---
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // --- Sincronizacao ---
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    // --- Credenciais ---
    // Os tokens ficam em EncryptedSharedPreferences: o refresh token vale 7 dias
    // e um coletor de galpão é um aparelho compartilhado, que se perde.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // --- Rede ---
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // --- Testes ---
    testImplementation 'junit:junit:4.13.2'
}
